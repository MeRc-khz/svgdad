<khz-sidebar [showSidebar]="showLeftSidebar" (close)="sidebarToggle()"></khz-sidebar>

<div class="khz-container">
  <div class="khz-content">

    <mat-toolbar class="savage-toolbar">
      <button (click)="sidebarToggle()" mat-icon-button class="nav-btn-menu" aria-label="Open Navigation Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <a routerLink="/" class="brand-logo-link">
        <span class="logo-txt">SAVAGE <span class="logo-accent">D.A.D.</span></span>
      </a>

      <nav class="nav-links">
        <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link-btn">
          HOME
        </a>
        <a mat-button routerLink="/products" routerLinkActive="active" class="nav-link-btn highlight-drop">
          THE DROP
        </a>
        <a mat-button routerLink="/products/cart" routerLinkActive="active" class="nav-link-btn">
          BAG
        </a>
      </nav>

      <span class="flex-spacer"></span>

      <!-- Announcement pill on desktop -->
      <div class="header-shipping-pill" routerLink="/products">
        <mat-icon>local_shipping</mat-icon>
        <span>FREE SHIPPING $75+</span>
      </div>

      <!-- Shopping Bag Button -->
      <div class="basket-wrap" (click)="sideListToggle()" aria-label="Open Shopping Bag">
        <button mat-icon-button class="nav-bag-btn">
          <mat-icon>shopping_bag</mat-icon>
        </button>
        <span class="basket-badge" *ngIf="basketCount() > 0">
          {{ basketCount() }}
        </span>
      </div>
    </mat-toolbar>

    <div class="outlet-container">
      <router-outlet></router-outlet>
    </div>

  </div>
  <khz-overlay (cartSize)="cartSize($event)" [comps]="comps"></khz-overlay>
</div>

<khz-side-list></khz-side-list>
